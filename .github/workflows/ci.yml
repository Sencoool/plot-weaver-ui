name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  # Opt-in. Drives a real browser against a running environment, so it is skipped
  # unless the repo variable E2E_BASE_URL is set (and optionally E2E_API_URL /
  # E2E_AI_ENABLED). There is deliberately no Postgres service here: the API and
  # its database are the other repo's concern, and this job talks to whatever the
  # variables point at.
  e2e:
    runs-on: ubuntu-latest
    if: vars.E2E_BASE_URL != ''
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e
        env:
          E2E_BASE_URL: ${{ vars.E2E_BASE_URL }}
          E2E_API_URL: ${{ vars.E2E_API_URL }}
          E2E_AI_ENABLED: ${{ vars.E2E_AI_ENABLED }}
